<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plythonic</title>
<meta name="description" content="Plythonic Discord Developeri">
<link rel="icon" type="image/png" href="logo.png" id="faviconLink">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020304;
  --panel:#12141B;
  --panel-solid:#0E1016;
  --line:#2A2E38;
  --ink:#F2F3F5;
  --muted:#8A8D95;
  --blue:#3B82F6;
  --green:#23C77A;
  --soft:rgba(255,255,255,.5);
  --font-d:'Space Grotesk',sans-serif;
  --font-b:'Inter',sans-serif;
}
html.light{
  --bg:#F5F6F8;
  --panel:#FFFFFF;
  --panel-solid:#FFFFFF;
  --line:#E2E4E8;
  --ink:#0B0C0F;
  --muted:#6B6E76;
  --soft:rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
html,body{min-height:100%;}
body{
  background:var(--bg);
  color:var(--soft);
  font-family:var(--font-b);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  position:relative;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  transition:background .25s,color .25s;
  touch-action:manipulation;
  -webkit-touch-callout:none;
}
button,a,.icon-btn,.lang-current,.lang-menu button{
  -webkit-tap-highlight-color:transparent;
  outline:none;
}
a{color:inherit;text-decoration:none;}
::selection{background:rgba(59,130,246,.35);color:#fff;}

#matrix{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  opacity:.55;
}

.site-header{
  position:relative;
  z-index:6;
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:56px;
  padding:0 16px;
  width:100%;
  border-bottom:1px solid rgba(255,255,255,.35);
  background:var(--bg);
}
html.light .site-header{
  border-bottom:1px solid rgba(0,0,0,.4);
}
.header-left{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--soft);
}
.brand .mark{
  position:relative;
  width:28px;
  height:28px;
  border-radius:8px 40% 40% 40%;
  background:var(--panel-solid);
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}
.brand .mark img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.brand .word{
  font-family:var(--font-d);
  font-weight:600;
  font-size:13.5px;
  letter-spacing:.02em;
}
.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
}
.icon-btn{
  width:30px;
  height:30px;
  border-radius:9px;
  background:var(--panel-solid);
  border:1px solid rgba(255,255,255,.35);
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:border-color .2s,color .2s,transform .2s;
}
html.light .icon-btn{
  border:1px solid rgba(0,0,0,.4);
}
.icon-btn:hover{
  border-color:var(--blue);
}
.icon-btn:active{
  transform:scale(.92);
}
.icon-btn svg{width:14px;height:14px;}
.icon-btn.spin svg{
  animation:spin-once .5s ease;
}
@keyframes spin-once{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
#themeBtn .icon-sun{display:none;}
#themeBtn .icon-moon{display:block;}
html.light #themeBtn .icon-sun{display:block;}
html.light #themeBtn .icon-moon{display:none;}
.lang-switch{
  position:relative;
}
.lang-current{
  height:30px;
  padding:0 10px;
  border-radius:9px;
  background:var(--panel-solid);
  border:1px solid rgba(255,255,255,.35);
  color:var(--blue);
  font-family:var(--font-b);
  font-weight:600;
  font-size:11.5px;
  letter-spacing:.03em;
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  transition:border-color .2s;
}
html.light .lang-current{
  border:1px solid rgba(0,0,0,.4);
}
.lang-current:hover{
  border-color:var(--blue);
}
.lang-current svg{
  width:11px;
  height:11px;
  color:var(--blue);
  transition:transform .2s;
}
.lang-switch.open .lang-current svg{
  transform:rotate(180deg);
}
.lang-menu{
  position:absolute;
  top:calc(100% + 8px);
  right:0;
  background:var(--panel-solid);
  border:1px solid rgba(255,255,255,.35);
  border-radius:10px;
  padding:6px;
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:100px;
  opacity:0;
  visibility:hidden;
  transform:translateY(-4px);
  transition:opacity .15s,transform .15s,visibility .15s;
  z-index:8;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.6);
}
html.light .lang-menu{
  border:1px solid rgba(0,0,0,.4);
}
.lang-switch.open .lang-menu{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}
.lang-menu button{
  background:transparent;
  border:none;
  color:var(--blue);
  font-family:var(--font-b);
  font-weight:500;
  font-size:11.5px;
  text-align:left;
  padding:7px 9px;
  border-radius:7px;
  cursor:pointer;
  transition:background .15s,color .15s;
}
.lang-menu button:hover{
  background:rgba(255,255,255,.05);
  color:var(--blue);
}
.lang-menu button.active{
  color:var(--blue);
  background:rgba(59,130,246,.1);
}

main{
  flex:1;
  min-height:150vh;
  min-width:0;
  position:relative;
  z-index:1;
}

.hero{
  position:relative;
  isolation:isolate;
  min-height:calc(100vh - 56px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:0;
  width:100%;
  padding:64px 0 32px;
}
.hero::before{
  content:"";
  position:absolute;
  top:-40px;
  left:-8%;
  width:62%;
  height:560px;
  background:radial-gradient(closest-side,rgba(59,130,246,.2),transparent);
  filter:blur(12px);
  pointer-events:none;
  z-index:-1;
}
.hero::after{
  content:"";
  position:absolute;
  bottom:-60px;
  right:-8%;
  width:62%;
  height:560px;
  background:radial-gradient(closest-side,rgba(59,130,246,.1),transparent);
  filter:blur(12px);
  pointer-events:none;
  z-index:-1;
}
.intro{
  width:100%;
  max-width:none;
  margin:0 0 56px;
  padding:0 56px;
  text-align:left;
  color:var(--soft);
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:7px 14px;
  border-radius:999px;
  background:rgba(59,130,246,.1);
  border:1px solid rgba(59,130,246,.4);
  color:var(--blue);
  font-size:12px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:22px;
}
.eyebrow::before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--blue);
  animation:dot-pulse 1.8s ease-in-out infinite;
}
@keyframes dot-pulse{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:.35;transform:scale(.7);}
}
.intro-head{
  margin-bottom:40px;
  max-width:none;
}
.intro h1{
  font-family:var(--font-d);
  font-weight:700;
  font-size:clamp(34px,4.4vw,56px);
  line-height:1.12;
  letter-spacing:-.015em;
  margin-bottom:20px;
  background:linear-gradient(100deg,#F2F3F5 0%,#9DBDFF 50%,#3B82F6 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
}
html.light .intro h1{
  background:linear-gradient(100deg,#0B0C0F 0%,#2B5FC7 55%,#3B82F6 100%);
  -webkit-background-clip:text;
  background-clip:text;
}
.intro .lead{
  font-size:18px;
  line-height:1.8;
  text-shadow:0 0 14px var(--bg),0 0 6px var(--bg);
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:13px 24px;
  border-radius:10px;
  background:var(--blue);
  color:#fff;
  font-weight:600;
  font-size:14px;
  transition:transform .2s,box-shadow .2s;
}
.btns{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:28px;
}
.btn.ghost{
  background:rgba(10,12,17,.5);
  border:1px solid rgba(255,255,255,.35);
  color:var(--soft);
}
html.light .btn.ghost{
  background:rgba(255,255,255,.6);
  border:1px solid rgba(0,0,0,.4);
}
.btn.ghost:hover{
  border-color:var(--blue);
  color:var(--blue);
  box-shadow:none;
}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 26px -10px rgba(59,130,246,.85);
}
.btn svg{
  width:16px;
  height:16px;
}
.info-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:22px;
}
.info-card{
  position:relative;
  overflow:hidden;
  grid-column:span 2;
  padding:28px 28px 30px;
  border-radius:16px;
  background:linear-gradient(180deg,rgba(59,130,246,.09),rgba(10,12,17,.86) 55%);
  border:1px solid rgba(255,255,255,.35);
  transition:border-color .2s,transform .2s,box-shadow .2s;
  animation:card-up .7s cubic-bezier(.22,.61,.36,1) backwards;
}
.info-card:nth-child(2){animation-delay:.08s;}
.info-card:nth-child(3){animation-delay:.16s;}
.info-card:nth-child(4){animation-delay:.24s;}
.info-card:nth-child(5){animation-delay:.32s;}
@keyframes card-up{
  from{opacity:0;transform:translateY(22px);}
  to{opacity:1;transform:translateY(0);}
}
html.light .info-card{
  background:linear-gradient(180deg,rgba(59,130,246,.09),rgba(255,255,255,.92) 55%);
  border:1px solid rgba(0,0,0,.4);
}
.info-card:hover{
  border-color:var(--blue);
  transform:translateY(-4px);
  box-shadow:0 22px 44px -26px rgba(59,130,246,.7);
}
.info-card.c3{
  grid-column:span 3;
}
.ic{
  width:44px;
  height:44px;
  border-radius:12px;
  background:rgba(59,130,246,.12);
  border:1px solid rgba(59,130,246,.4);
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:18px;
}
.ic svg{
  width:22px;
  height:22px;
}
.info-card h2{
  font-family:var(--font-d);
  font-weight:600;
  font-size:20px;
  margin-bottom:12px;
}
.info-card p{
  font-size:15px;
  line-height:1.85;
  overflow-wrap:anywhere;
}
.info-card ol,.info-card ul{
  list-style:none;
  display:flex;
  flex-direction:column;
}
.info-card li{
  padding:13px 0;
  border-bottom:1px solid rgba(255,255,255,.14);
}
html.light .info-card li{
  border-bottom:1px solid rgba(0,0,0,.14);
}
.info-card li:first-child{
  padding-top:0;
}
.info-card li:last-child{
  padding-bottom:0;
  border-bottom:none;
}
.info-card ol li{
  display:flex;
  align-items:center;
  gap:14px;
  font-size:15px;
  line-height:1.6;
}
.info-card ol li i{
  flex:0 0 auto;
  width:30px;
  height:30px;
  border-radius:50%;
  border:1px solid var(--blue);
  background:rgba(59,130,246,.1);
  color:var(--blue);
  font-style:normal;
  font-weight:600;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.info-card ul li{
  display:flex;
  align-items:flex-start;
  gap:14px;
  font-size:15px;
  line-height:1.7;
}
.info-card ul li .pi{
  flex:0 0 auto;
  width:24px;
  height:24px;
  margin-top:2px;
  color:var(--blue);
}
.info-card ul li .pi svg{
  width:24px;
  height:24px;
}
.info-card ul li b{
  display:block;
  font-weight:600;
}
.mq-head{
  width:100%;
  height:32px;
}
.marquee{
  width:100%;
  overflow:hidden;
  padding:40px 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
}
.marquee-track{
  display:flex;
  width:max-content;
  animation:marquee-ltr 28s linear infinite;
}
.marquee:hover .marquee-track{
  animation-play-state:paused;
}
@keyframes marquee-ltr{
  from{transform:translateX(-50%);}
  to{transform:translateX(0);}
}
.plat{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
  margin-right:24px;
  min-width:460px;
  height:260px;
  padding:0 40px;
  border-radius:16px;
  background:linear-gradient(180deg,rgba(59,130,246,.09),rgba(10,12,17,.86) 55%);
  border:1px solid rgba(255,255,255,.35);
  color:var(--soft);
  font-family:var(--font-d);
  font-weight:600;
  font-size:30px;
  white-space:nowrap;
  cursor:pointer;
  transition:border-color .2s,transform .2s,box-shadow .2s;
}
html.light .plat{
  background:linear-gradient(180deg,rgba(59,130,246,.09),rgba(255,255,255,.92) 55%);
  border:1px solid rgba(0,0,0,.4);
}
.plat:hover{
  border-color:var(--blue);
  transform:translateY(-4px);
  box-shadow:0 22px 44px -26px rgba(59,130,246,.7);
}
.plat svg{
  position:relative;
  color:var(--blue);
  width:56px;
  height:56px;
  flex-shrink:0;
}
.plat span{
  position:relative;
}
.site-footer{
  position:relative;
  z-index:2;
  width:100%;
  padding:14px 20px 20px;
  border-top:1px solid rgba(255,255,255,.35);
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px 18px;
  font-size:11px;
  color:rgba(255,255,255,.5);
  box-shadow:0 -24px 60px -34px rgba(59,130,246,.55);
}
html.light .site-footer{
  border-top:1px solid rgba(0,0,0,.4);
  color:rgba(0,0,0,.5);
}
.site-footer a:hover{
  color:var(--blue);
}

@media (max-width:980px){
  .intro{padding:0 24px;}
  .info-grid{grid-template-columns:1fr;}
  .info-card,.info-card.c3{grid-column:auto;}
}
@media (max-width:640px){
  .site-header{padding:0 12px;}
  .intro{padding:0 16px;}
  .intro h1{font-size:30px;}
  .intro .lead{font-size:16px;}
  .info-card{padding:22px 20px;}
  .plat{min-width:320px;height:200px;font-size:24px;}
  .plat svg{width:44px;height:44px;}
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<header class="site-header">
  <div class="header-left">
    <a class="brand" href="#">
      <span class="mark"><img src="plythonic.png" alt="" onerror="this.style.display='none'"></span>
      <span class="word">Plythonic</span>
    </a>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="themeBtn" type="button" title="Tema" aria-label="Tema">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
    </button>
    <button class="icon-btn" id="restartBtn" type="button" title="Yenilə" aria-label="Yenilə">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.36"/><path d="M21 4v5h-5"/></svg>
    </button>
    <div class="lang-switch" id="langSwitch">
      <button class="lang-current" id="langCurrent" type="button" aria-haspopup="true" aria-expanded="false">
        <span id="langCurrentLabel">TR</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="lang-menu" id="langMenu">
        <button type="button" data-lang="tr" class="active">Türkçe</button>
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="ru">Русский</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="hero">
    <section class="intro">
      <div class="intro-head">
        <span class="eyebrow" data-i18n="eyebrow"></span>
        <h1 data-i18n="intro_title"></h1>
        <p class="lead" data-i18n="intro_lead"></p>
        <div class="btns">
          <a class="btn" href="#platforms"><span data-i18n="cta"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg></a>
          <a class="btn ghost" href="https://discord.gg/plython" target="_blank" rel="noopener"><span data-i18n="cta2"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg></a>
        </div>
      </div>
      <div class="info-grid">
        <article class="info-card">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></div>
          <h2 data-i18n="s1_t"></h2>
          <p data-i18n="s1_p"></p>
        </article>
        <article class="info-card">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></div>
          <h2 data-i18n="s2_t"></h2>
          <p data-i18n="s2_p"></p>
        </article>
        <article class="info-card">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg></div>
          <h2 data-i18n="s3_t"></h2>
          <p data-i18n="s3_p"></p>
        </article>
        <article class="info-card c3">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg></div>
          <h2 data-i18n="s4_t"></h2>
          <ol>
            <li><i>1</i><span data-i18n="st1"></span></li>
            <li><i>2</i><span data-i18n="st2"></span></li>
            <li><i>3</i><span data-i18n="st3"></span></li>
            <li><i>4</i><span data-i18n="st4"></span></li>
          </ol>
        </article>
        <article class="info-card c3">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
          <h2 data-i18n="s5_t"></h2>
          <ul>

(function(){
  var canvas = document.getElementById('matrix');
  var ctx = canvas.getContext('2d');
  var chars = "01{}<>/=+*#[]();$%&PLYTHONIC".split("");
  var fontSize = 15;
  var columns, drops, dpr;
  var fadeRGB = "2,3,4";

  function setup(){
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    columns = Math.floor(window.innerWidth / fontSize);
    drops = new Array(columns).fill(0).map(function(){
      return Math.floor(Math.random() * -50);
    });
  }
  setup();
  window.addEventListener('resize', setup);

  function draw(){
    ctx.fillStyle = "rgba(" + fadeRGB + ",0.12)";
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    ctx.font = fontSize + "px 'JetBrains Mono', monospace";

    for(var i = 0; i < drops.length; i++){
      var text = chars[Math.floor(Math.random() * chars.length)];
      var x = i * fontSize;
      var y = drops[i] * fontSize;

      ctx.fillStyle = "rgba(59,130,246,0.9)";
      ctx.fillText(text, x, y);

      if(y > window.innerHeight && Math.random() > 0.975){
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  setInterval(draw, 45);

  var themeBtn = document.getElementById('themeBtn');
  function applyTheme(theme){
    if(theme === 'light'){
      document.documentElement.classList.add('light');
      fadeRGB = "245,246,248";
      ctx.fillStyle = "rgba(245,246,248,1)";
      canvas.style.opacity = "0.9";
    } else {
      document.documentElement.classList.remove('light');
      fadeRGB = "2,3,4";
      ctx.fillStyle = "rgba(2,3,4,1)";
      canvas.style.opacity = "0.55";
    }
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    localStorage.setItem('plythonic-theme', theme);
  }
  themeBtn.addEventListener('click', function(){
    var next = document.documentElement.classList.contains('light') ? 'dark' : 'light';
    applyTheme(next);
  });
  var savedTheme = localStorage.getItem('plythonic-theme');
  applyTheme(savedTheme === 'light' ? 'light' : 'dark');
})();
