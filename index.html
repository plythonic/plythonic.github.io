<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plythonic</title>
<meta name="description" content="Plythonic Discord Developeri">
<link rel="icon" type="image/png" href="logo.png" id="faviconLink">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020304;
  --panel:#12141B;
  --panel-solid:#0E1016;
  --line:#2A2E38;
  --ink:#F2F3F5;
  --muted:#8A8D95;
  --blue:#3B82F6;
  --green:#23C77A;
  --font-d:'Space Grotesk',sans-serif;
  --font-b:'Inter',sans-serif;
}
html.light{
  --bg:#F5F6F8;
  --panel:#FFFFFF;
  --panel-solid:#FFFFFF;
  --line:#E2E4E8;
  --ink:#0B0C0F;
  --muted:#6B6E76;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-b);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  position:relative;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  transition:background .25s,color .25s;
  touch-action:manipulation;
  -webkit-touch-callout:none;
}
button,a,.icon-btn,.lang-current,.lang-menu button{
  -webkit-tap-highlight-color:transparent;
  outline:none;
}
a{color:inherit;text-decoration:none;}
::selection{background:rgba(59,130,246,.35);color:#fff;}

#matrix{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  opacity:.55;
}

.site-header{
  position:relative;
  z-index:6;
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:56px;
  padding:0 16px;
  width:100%;
  border-bottom:1px solid rgba(255,255,255,.35);
  background:var(--bg);
}
html.light .site-header{
  border-bottom:1px solid rgba(0,0,0,.4);
}
.header-left{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--ink);
}
.brand .mark{
  position:relative;
  width:28px;
  height:28px;
  border-radius:8px 40% 40% 40%;
  background:var(--panel-solid);
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}
.brand .mark img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.brand .word{
  font-family:var(--font-d);
  font-weight:600;
  font-size:13.5px;
  letter-spacing:.02em;
}
.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
}
.icon-btn{
  width:30px;
  height:30px;
  border-radius:9px;
  background:var(--panel-solid);
  border:1px solid rgba(255,255,255,.35);
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:border-color .2s,color .2s,transform .2s;
}
html.light .icon-btn{
  border:1px solid rgba(0,0,0,.4);
}
.icon-btn:hover{
  border-color:var(--blue);
}
.icon-btn:active{
  transform:scale(.92);
}
.icon-btn svg{width:14px;height:14px;}
.icon-btn.spin svg{
  animation:spin-once .5s ease;
}
@keyframes spin-once{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
#themeBtn .icon-sun{display:none;}
#themeBtn .icon-moon{display:block;}
html.light #themeBtn .icon-sun{display:block;}
html.light #themeBtn .icon-moon{display:none;}
.lang-switch{
  position:relative;
}
.lang-current{
  height:30px;
  padding:0 10px;
  border-radius:9px;
  background:var(--panel-solid);
  border:1px solid rgba(255,255,255,.35);
  color:var(--blue);
  font-family:var(--font-b);
  font-weight:600;
  font-size:11.5px;
  letter-spacing:.03em;
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  transition:border-color .2s;
}
html.light .lang-current{
  border:1px solid rgba(0,0,0,.4);
}
.lang-current:hover{
  border-color:var(--blue);
}
.lang-current svg{
  width:11px;
  height:11px;
  color:var(--blue);
  transition:transform .2s;
}
.lang-switch.open .lang-current svg{
  transform:rotate(180deg);
}
.lang-menu{
  position:absolute;
  top:calc(100% + 8px);
  right:0;
  background:var(--panel-solid);
  border:1px solid rgba(255,255,255,.35);
  border-radius:10px;
  padding:6px;
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:100px;
  opacity:0;
  visibility:hidden;
  transform:translateY(-4px);
  transition:opacity .15s,transform .15s,visibility .15s;
  z-index:8;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.6);
}
html.light .lang-menu{
  border:1px solid rgba(0,0,0,.4);
}
.lang-switch.open .lang-menu{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}
.lang-menu button{
  background:transparent;
  border:none;
  color:var(--muted);
  font-family:var(--font-b);
  font-weight:500;
  font-size:11.5px;
  text-align:left;
  padding:7px 9px;
  border-radius:7px;
  cursor:pointer;
  transition:background .15s,color .15s;
}
.lang-menu button:hover{
  background:rgba(255,255,255,.05);
  color:var(--ink);
}
.lang-menu button.active{
  color:var(--blue);
  background:rgba(59,130,246,.1);
}

.layout{
  flex:1;
  display:flex;
  position:relative;
  z-index:1;
}
.sidebar{
  width:300px;
  flex-shrink:0;
  background:transparent;
  border-right:1px solid rgba(255,255,255,.35);
  padding:16px 14px;
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  gap:4px;
}
html.light .sidebar{
  border-right:1px solid rgba(0,0,0,.4);
}
body.nav-closed .sidebar{display:none;}
.nav-item{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 12px;
  border-radius:8px;
  font-size:13px;
  font-weight:500;
  color:var(--ink);
  transition:background .15s;
}
.nav-item:hover{
  background:rgba(255,255,255,.05);
}
html.light .nav-item:hover{
  background:rgba(0,0,0,.05);
}
.nav-item.active{
  background:rgba(59,130,246,.12);
  font-weight:600;
}
.nav-item.active::before{
  content:"";
  position:absolute;
  left:-14px;
  top:50%;
  transform:translateY(-50%);
  width:3px;
  height:22px;
  border-radius:0 3px 3px 0;
  background:var(--blue);
}
.nav-item svg{
  width:16px;
  height:16px;
  color:var(--blue);
  flex-shrink:0;
}
.nav-sep{
  height:1px;
  background:rgba(255,255,255,.35);
  margin:12px 0 10px;
}
html.light .nav-sep{
  background:rgba(0,0,0,.4);
}
.nav-label{
  padding:4px 12px 6px;
  font-size:11.5px;
  font-weight:600;
  color:var(--muted);
  letter-spacing:.04em;
}

main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:1;
}
.content{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:28px;
  padding:36px 40px 40px;
}
.feed{
  flex:1 1 560px;
  max-width:900px;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.aside{
  flex:0 0 310px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.card{
  background:rgba(18,20,27,.12);
  backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);
  border:1px solid rgba(255,255,255,.35);
  border-radius:14px;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06);
  transition:background .25s,border-color .25s,transform .2s;
  opacity:0;
  transform:translateY(18px);
  animation:card-in .6s cubic-bezier(.22,.61,.36,1) forwards;
}
html.light .card{
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(0,0,0,.4);
  box-shadow:0 12px 30px -18px rgba(0,0,0,.18);
}
.feed .card:nth-of-type(1){animation-delay:.08s;}
.feed .card:nth-of-type(2){animation-delay:.16s;}
.aside .card{animation-delay:.12s;}
@keyframes card-in{
  to{
    opacity:1;
    transform:translateY(0);
  }
}
.greeting{
  display:flex;
  align-items:center;
  gap:12px;
  font-family:var(--font-d);
  font-weight:700;
  font-size:20px;
  letter-spacing:-.01em;
  margin-bottom:6px;
}
.greeting .g-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  background:rgba(59,130,246,.1);
  border:1px solid rgba(59,130,246,.35);
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.greeting .g-icon svg{width:18px;height:18px;}
.section-title{
  font-family:var(--font-d);
  font-weight:600;
  font-size:14px;
  padding:12px 2px 0;
}
.empty-card{
  padding:26px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:4px;
  min-height:96px;
}
.empty-card .v{
  font-family:var(--font-d);
  font-weight:700;
  font-size:17px;
}
.empty-card .s{
  color:var(--muted);
  font-size:11.5px;
}
.card-head{
  padding:12px 18px;
  font-family:var(--font-d);
  font-weight:600;
  font-size:14px;
}
.divider{
  height:1px;
  background:rgba(255,255,255,.35);
  margin:0 18px;
}
html.light .divider{
  background:rgba(0,0,0,.4);
}
.card-body{
  padding:16px 18px;
}
.social-links{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.link{
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(255,255,255,.015);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.35);
  padding:9px 11px;
  border-radius:10px;
  color:var(--ink);
  font-size:12px;
  font-weight:600;
  transition:border-color .2s,transform .2s,background .2s;
}
.link:hover{
  border-color:var(--blue);
  transform:translateY(-1px);
}
html.light .link{
  background:rgba(0,0,0,.015);
  border:1px solid rgba(0,0,0,.4);
}
.link .ic{
  width:15px;
  height:15px;
  flex-shrink:0;
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
}
.link .ic svg{width:15px;height:15px;}
.link .label{flex:1;}
.link .arrow{
  color:var(--blue);
  display:flex;
  align-items:center;
  transition:transform .2s;
}
.link:hover .arrow{
  transform:translate(2px,-2px);
}

.site-footer{
  position:relative;
  z-index:2;
  width:100%;
  padding:14px 20px 20px;
  border-top:1px solid rgba(255,255,255,.35);
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px 18px;
  font-size:11px;
  color:rgba(255,255,255,.5);
}
html.light .site-footer{
  border-top:1px solid rgba(0,0,0,.4);
  color:rgba(0,0,0,.5);
}
.site-footer a:hover{
  color:var(--blue);
}

@media (max-width:980px){
  .sidebar{
    position:fixed;
    top:56px;
    bottom:0;
    left:0;
    background:var(--bg);
    z-index:5;
  }
  .content{padding:24px 20px 32px;}
  .aside{flex:1 1 100%;}
}
@media (max-width:640px){
  .site-header{padding:0 12px;}
  .content{padding:20px 14px 28px;}
  .greeting{font-size:17px;}
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<header class="site-header">
  <div class="header-left">
    <button class="icon-btn" id="navBtn" type="button" title="Menü" aria-label="Menü">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#">
      <span class="mark"><img src="plythonic.png" alt="" onerror="this.style.display='none'"></span>
      <span class="word">Plythonic</span>
    </a>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="themeBtn" type="button" title="Tema" aria-label="Tema">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
    </button>
    <button class="icon-btn" id="restartBtn" type="button" title="Yenilə" aria-label="Yenilə">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.36"/><path d="M21 4v5h-5"/></svg>
    </button>
    <div class="lang-switch" id="langSwitch">
      <button class="lang-current" id="langCurrent" type="button" aria-haspopup="true" aria-expanded="false">
        <span id="langCurrentLabel">TR</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="lang-menu" id="langMenu">
        <button type="button" data-lang="tr" class="active">Türkçe</button>
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="ru">Русский</button>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <a class="nav-item active" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
      <span data-i18n="nav_home">Ana Sayfa</span>
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V4M9 3.4h6"/><circle cx="9" cy="13.2" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="13.2" r="1" fill="currentColor" stroke="none"/><path d="M9 16.5h6"/></svg>
      <span>Plython</span>
    </a>
    <div class="nav-sep"></div>
    <div class="nav-label" data-i18n="nav_projects">PROJELER</div>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Plythonic</span>
    </a>
  </aside>

  <main>
    <div class="content">
      <section class="feed">
        <div class="greeting">
          <span class="g-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V4M9 3.4h6"/><circle cx="9" cy="13.2" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="13.2" r="1" fill="currentColor" stroke="none"/><path d="M9 16.5h6"/></svg></span>
          <span data-i18n="greeting">Hoş geldin, Plythonic!</span>
        </div>

        <div class="section-title" data-i18n="about_title">Hakkımda</div>
        <div class="card empty-card">
          <span class="v" data-i18n="soon_value">Yakında</span>
          <span class="s" data-i18n="soon_sub">Bu özellik yakında hazır olacak</span>
        </div>

        <div class="section-title">Plython</div>
        <div class="card empty-card">
          <span class="v" data-i18n="soon_value">Yakında</span>
          <span class="s" data-i18n="soon_sub">Bu özellik yakında hazır olacak</span>
        </div>
      </section>

      <aside class="aside">
        <div class="card">
          <div class="card-head" data-i18n="social_title">Sosyal Ağlar</div>
          <div class="divider"></div>
          <div class="card-body">
            <div class="social-links">
              <a class="link" href="https://discord.gg/plython" target="_blank" rel="noopener">
                <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4.5c-2 .6-3.6 1.6-5 3-1.6 3.6-2.3 7.6-2 11.5 1.8 1.5 3.8 2.5 6 3l1.2-2"/><path d="M16 4.5c2 .6 3.6 1.6 5 3 1.6 3.6 2.3 7.6 2 11.5-1.8 1.5-3.8 2.5-6 3l-1.2-2"/><path d="M8 15.5c2.8 1.3 5.2 1.3 8 0"/><circle cx="9" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg></span>
                <span class="label">Discord</span>
                <span class="arrow"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span>
              </a>
              <a class="link" href="https://www.instagram.com/plythonic" target="_blank" rel="noopener">
                <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></span>
                <span class="label">Instagram</span>
                <span class="arrow"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span>
              </a>
              <a class="link" href="https://github.com/plythonic" target="_blank" rel="noopener">
                <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 1.7 5.4 2 5.4 2a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 8.4c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V19"/></svg></span>
                <span class="label">GitHub</span>
                <span class="arrow"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span>
              </a>
              <a class="link" href="https://www.youtube.com/@plythonic" target="_blank" rel="noopener">
                <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9.5l5 2.5-5 2.5v-5z" fill="currentColor" stroke="none"/></svg></span>
                <span class="label">YouTube</span>
                <span class="arrow"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span>
              </a>
            </div>
          </div>
        </div>
      </aside>
    </div>

<script>
(function(){
  var canvas = document.getElementById('matrix');
  var ctx = canvas.getContext('2d');
  var chars = "01{}<>/=+*#[]();$%&PLYTHONIC".split("");
  var fontSize = 15;
  var columns, drops, dpr;
  var fadeRGB = "2,3,4";

  function setup(){
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    columns = Math.floor(window.innerWidth / fontSize);
    drops = new Array(columns).fill(0).map(function(){
      return Math.floor(Math.random() * -50);
    });
  }
  setup();
  window.addEventListener('resize', setup);

  function draw(){
    ctx.fillStyle = "rgba(" + fadeRGB + ",0.12)";
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    ctx.font = fontSize + "px 'JetBrains Mono', monospace";

    for(var i = 0; i < drops.length; i++){
      var text = chars[Math.floor(Math.random() * chars.length)];
      var x = i * fontSize;
      var y = drops[i] * fontSize;

      ctx.fillStyle = "rgba(59,130,246,0.9)";
      ctx.fillText(text, x, y);

      if(y > window.innerHeight && Math.random() > 0.975){
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  setInterval(draw, 45);

  var themeBtn = document.getElementById('themeBtn');
  function applyTheme(theme){
    if(theme === 'light'){
      document.documentElement.classList.add('light');
      fadeRGB = "245,246,248";
      ctx.fillStyle = "rgba(245,246,248,1)";
      canvas.style.opacity = "0.9";
    } else {
      document.documentElement.classList.remove('light');
      fadeRGB = "2,3,4";
      ctx.fillStyle = "rgba(2,3,4,1)";
      canvas.style.opacity = "0.55";
    }
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    localStorage.setItem('plythonic-theme', theme);
  }
  themeBtn.addEventListener('click', function(){
    var next = document.documentElement.classList.contains('light') ? 'dark' : 'light';
    applyTheme(next);
  });
  var savedTheme = localStorage.getItem('plythonic-theme');
  applyTheme(savedTheme === 'light' ? 'light' : 'dark');
})();

(function(){
  var translations = {
    en:{
      nav_home:"Home",
      nav_projects:"PROJECTS",
      greeting:"Welcome, Plythonic!",
      about_title:"About Me",
      soon_value:"Coming soon",
      soon_sub:"This feature will be ready soon",
      social_title:"Social Networks",
      label:"EN"
    },
    tr:{
      nav_home:"Ana Sayfa",
      nav_projects:"PROJELER",
      greeting:"Hoş geldin, Plythonic!",
      about_title:"Hakkımda",
      soon_value:"Yakında",
      soon_sub:"Bu özellik yakında hazır olacak",
      social_title:"Sosyal Ağlar",
      label:"TR"
    },
    ru:{
      nav_home:"Главная",
      nav_projects:"ПРОЕКТЫ",
      greeting:"Добро пожаловать, Plythonic!",
      about_title:"Обо мне",
      soon_value:"Скоро",
      soon_sub:"Эта функция скоро будет готова",
      social_title:"Социальные сети",
      label:"RU"
    }
  };

  var langSwitch = document.getElementById('langSwitch');
  var langCurrent = document.getElementById('langCurrent');
  var langCurrentLabel = document.getElementById('langCurrentLabel');
  var langMenu = document.getElementById('langMenu');
  var restartBtn = document.getElementById('restartBtn');
  var navBtn = document.getElementById('navBtn');

  function applyLang(lang){
    var dict = translations[lang] || translations.tr;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if(dict[key]) el.textContent = dict[key];
    });
    langCurrentLabel.textContent = dict.label;
    document.documentElement.lang = lang;
    langMenu.querySelectorAll('button').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });
    localStorage.setItem('plythonic-lang-v2', lang);
  }

  langCurrent.addEventListener('click', function(e){
    e.stopPropagation();
    var isOpen = langSwitch.classList.toggle('open');
    langCurrent.setAttribute('aria-expanded', isOpen);
  });

  langMenu.querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click', function(){
      applyLang(btn.getAttribute('data-lang'));
      langSwitch.classList.remove('open');
      langCurrent.setAttribute('aria-expanded', 'false');
    });
  });

  document.addEventListener('click', function(){
    langSwitch.classList.remove('open');
    langCurrent.setAttribute('aria-expanded', 'false');
  });

  navBtn.addEventListener('click', function(e){
    e.stopPropagation();
    document.body.classList.toggle('nav-closed');
  });

  if(window.innerWidth <= 980){
    document.body.classList.add('nav-closed');
  }

  restartBtn.addEventListener('click', function(){
    restartBtn.classList.add('spin');
    setTimeout(function(){ location.reload(); }, 300);
  });

  var savedLang = localStorage.getItem('plythonic-lang-v2');
  applyLang(savedLang && translations[savedLang] ? savedLang : 'tr');
})();
</script>
