<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plythonic</title>
<meta name="description" content="Plythonic Discord Developeri">
<link rel="icon" type="image/png" href="logo.png" id="faviconLink">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020304;
  --panel:#12141B;
  --panel-solid:#0E1016;
  --line:#2A2E38;
  --ink:#F2F3F5;
  --muted:#8A8D95;
  --blue:#3B82F6;
  --green:#23C77A;
  --font-d:'Space Grotesk',sans-serif;
  --font-b:'Inter',sans-serif;
}
html.light{
  --bg:#F5F6F8;
  --panel:#FFFFFF;
  --panel-solid:#FFFFFF;
  --line:#E2E4E8;
  --ink:#0B0C0F;
  --muted:#6B6E76;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-b);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  position:relative;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  transition:background .25s,color .25s;
  touch-action:manipulation;
  -webkit-touch-callout:none;
}
button,a,.icon-btn,.lang-current,.lang-menu button{
  -webkit-tap-highlight-color:transparent;
  outline:none;
}
a{color:inherit;text-decoration:none;}
::selection{background:rgba(59,130,246,.35);color:#fff;}

#matrix{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  opacity:.55;
}

.site-header{
  position:relative;
  z-index:6;
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:56px;
  padding:0 16px;
  width:100%;
  border-bottom:1px solid rgba(255,255,255,.35);
  background:var(--bg);
}
html.light .site-header{
  border-bottom:1px solid rgba(0,0,0,.4);
}
.header-left{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--ink);
}
.brand .mark{
  position:relative;
  width:28px;
  height:28px;
  border-radius:8px 40% 40% 40%;
  background:var(--panel-solid);
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}
.brand .mark img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.brand .word{
  font-family:var(--font-d);
  font-weight:600;
  font-size:13.5px;
  letter-spacing:.02em;
}
.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
}
.icon-btn{
  width:30px;
  height:30px;
  border-radius:9px;
  background:var(--panel-solid);
  border:1px solid rgba(255,255,255,.35);
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:border-color .2s,color .2s,transform .2s;
}
html.light .icon-btn{
  border:1px solid rgba(0,0,0,.4);
}
.icon-btn:hover{
  border-color:var(--blue);
}
.icon-btn:active{
  transform:scale(.92);
}
.icon-btn svg{width:14px;height:14px;}
.icon-btn.spin svg{
  animation:spin-once .5s ease;
}
@keyframes spin-once{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
#themeBtn .icon-sun{display:none;}
#themeBtn .icon-moon{display:block;}
html.light #themeBtn .icon-sun{display:block;}
html.light #themeBtn .icon-moon{display:none;}
.lang-switch{
  position:relative;
}
.lang-current{
  height:30px;
  padding:0 10px;
  border-radius:9px;
  background:var(--panel-solid);
  border:1px solid rgba(255,255,255,.35);
  color:var(--blue);
  font-family:var(--font-b);
  font-weight:600;
  font-size:11.5px;
  letter-spacing:.03em;
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  transition:border-color .2s;
}
html.light .lang-current{
  border:1px solid rgba(0,0,0,.4);
}
.lang-current:hover{
  border-color:var(--blue);
}
.lang-current svg{
  width:11px;
  height:11px;
  color:var(--blue);
  transition:transform .2s;
}
.lang-switch.open .lang-current svg{
  transform:rotate(180deg);
}
.lang-menu{
  position:absolute;
  top:calc(100% + 8px);
  right:0;
  background:var(--panel-solid);
  border:1px solid rgba(255,255,255,.35);
  border-radius:10px;
  padding:6px;
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:100px;
  opacity:0;
  visibility:hidden;
  transform:translateY(-4px);
  transition:opacity .15s,transform .15s,visibility .15s;
  z-index:8;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.6);
}
html.light .lang-menu{
  border:1px solid rgba(0,0,0,.4);
}
.lang-switch.open .lang-menu{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}
.lang-menu button{
  background:transparent;
  border:none;
  color:var(--muted);
  font-family:var(--font-b);
  font-weight:500;
  font-size:11.5px;
  text-align:left;
  padding:7px 9px;
  border-radius:7px;
  cursor:pointer;
  transition:background .15s,color .15s;
}
.lang-menu button:hover{
  background:rgba(255,255,255,.05);
  color:var(--ink);
}
.lang-menu button.active{
  color:var(--blue);
  background:rgba(59,130,246,.1);
}

.layout{
  flex:1;
  display:flex;
  position:relative;
  z-index:1;
}
.sidebar{
  width:300px;
  flex-shrink:0;
  background:transparent;
  border-right:1px solid rgba(255,255,255,.35);
  padding:16px 14px;
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  gap:4px;
}
html.light .sidebar{
  border-right:1px solid rgba(0,0,0,.4);
}
body.nav-closed .sidebar{display:none;}
.nav-item{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 12px;
  border-radius:8px;
  font-size:13px;
  font-weight:500;
  color:var(--ink);
  transition:background .15s;
}
.nav-item:hover{
  background:rgba(255,255,255,.05);
}
html.light .nav-item:hover{
  background:rgba(0,0,0,.05);
}
.nav-item.active{
  background:rgba(59,130,246,.12);
  font-weight:600;
}
.nav-item.active::before{
  content:"";
  position:absolute;
  left:-14px;
  top:50%;
  transform:translateY(-50%);
  width:3px;
  height:22px;
  border-radius:0 3px 3px 0;
  background:var(--blue);
}
.nav-item svg{
  width:16px;
  height:16px;
  color:var(--blue);
  flex-shrink:0;
}
.nav-sep{
  height:1px;
  background:rgba(255,255,255,.35);
  margin:12px 0 10px;
}
html.light .nav-sep{
  background:rgba(0,0,0,.4);
}
.nav-label{
  padding:4px 12px 6px;
  font-size:11.5px;
  font-weight:600;
  color:var(--muted);
  letter-spacing:.04em;
}

main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:1;
}
.content{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:28px;
  padding:36px 40px 40px;
}
.feed{
  flex:1 1 560px;
  max-width:900px;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.aside{
  flex:0 0 310px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.card{
  background:rgba(18,20,27,.12);
  backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);
  border:1px solid rgba(255,255,255,.35);
  border-radius:14px;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06);
  transition:background .25s,border-color .25s,transform .2s;
  opacity:0;
  transform:translateY(18px);
  animation:card-in .6s cubic-bezier(.22,.61,.36,1) forwards;
}
html.light .card{
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(0,0,0,.4);
  box-shadow:0 12px 30px -18px rgba(0,0,0,.18);
}
.aside .card{animation-delay:.12s;}
@keyframes card-in{
  to{
    opacity:1;
    transform:translateY(0);
  }
}
.greeting{
  display:flex;
  align-items:center;
  gap:12px;
  font-family:var(--font-d);
  font-weight:700;
  font-size:20px;
  letter-spacing:-.01em;
  margin-bottom:6px;
}
.greeting .g-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  background:rgba(59,130,246,.1);
  border:1px solid rgba(59,130,246,.35);
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.greeting .g-icon svg{width:18px;height:18px;}
.section-title{
  font-family:var(--font-d);
  font-weight:600;
  font-size:14px;
  padding:12px 2px 0;
}
.term-card{animation-delay:.08s;}
.term-head{
  display:flex;
  align-items:center;
  gap:7px;
  padding:11px 16px;
  border-bottom:1px solid rgba(255,255,255,.35);
}
html.light .term-head{
  border-bottom:1px solid rgba(0,0,0,.4);
}
.term-head .dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--blue);
}
.term-head .dot:nth-child(2){opacity:.6;}
.term-head .dot:nth-child(3){opacity:.3;}
.term-title{
  margin-left:8px;
  font-family:ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  font-size:11.5px;
  color:var(--muted);
}
.t-line{white-space:pre-wrap;word-break:break-word;}
.t-prompt{color:var(--blue);}
.t-out{color:var(--muted);}
.t-err{color:#ff5c6c;}
.t-warn{color:#e5b53b;}
.t-ok{color:var(--green);}

#viewTerm .content{padding:12px 16px;align-items:stretch;}
.term-col{
  flex:1 1 100%;
  width:100%;
  max-width:none;
  min-width:0;
  display:flex;
  flex-direction:column;
}
.ide{
  animation-delay:.08s;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  height:calc(100vh - 150px);
  min-height:380px;
}
.ide .term-head{padding:9px 14px;flex-wrap:wrap;flex:0 0 auto;}
.term-select{
  margin-left:auto;
  background:var(--panel-solid);
  color:var(--blue);
  border:1px solid rgba(255,255,255,.35);
  border-radius:8px;
  font-family:var(--font-b);
  font-weight:600;
  font-size:11.5px;
  height:28px;
  padding:0 8px;
  outline:none;
  cursor:pointer;
}
html.light .term-select{border:1px solid rgba(0,0,0,.4);}
.term-editor{
  width:100%;
  flex:1 1 auto;
  min-height:0;
  resize:none;
  display:block;
  background:transparent;
  color:var(--ink);
  border:none;
  outline:none;
  padding:16px 18px;
  font-family:ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  font-size:13.5px;
  line-height:1.7;
  tab-size:4;
  white-space:pre;
  overflow:auto;
}
.term-btn{
  height:28px;
  padding:0 12px;
  border-radius:8px;
  background:rgba(255,255,255,.015);
  border:1px solid rgba(255,255,255,.35);
  color:var(--ink);
  font-family:var(--font-b);
  font-weight:600;
  font-size:11.5px;
  cursor:pointer;
  outline:none;
  transition:border-color .2s,transform .1s;
}
html.light .term-btn{border:1px solid rgba(0,0,0,.4);}
.term-btn:hover{border-color:var(--blue);}
.term-btn:active{transform:scale(.95);}
.term-btn.run{background:var(--blue);border-color:var(--blue);color:#fff;}
.term-btn.run::before{content:"▶ ";}
.term-btn.stop::before{content:"■ ";}
.term-btn.restart::before{content:"↻ ";}
.term-btn.kill::before{content:"✕ ";}
.term-btn.stop,.term-btn.kill{color:#ff5c6c;}
.term-btn.stop:hover,.term-btn.kill:hover{border-color:#ff5c6c;}
.term-btn:disabled{opacity:.4;cursor:not-allowed;}
.term-btn.run:disabled{cursor:wait;opacity:.6;}
.panel-head{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 16px;
  border-top:1px solid rgba(255,255,255,.35);
}
html.light .panel-head{border-top:1px solid rgba(0,0,0,.4);}
.panel-tab{
  font-size:11px;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  padding-bottom:3px;
  border-bottom:1.5px solid var(--blue);
}
.term-out{
  padding:8px 18px 10px;
  flex:0 0 120px;
  height:120px;
  overflow:auto;
  font-family:ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  font-size:12.5px;
  line-height:1.7;
}
.tiles{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.tile{
  padding:16px 18px;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.tile:nth-child(1){animation-delay:.14s;}
.tile:nth-child(2){animation-delay:.2s;}
.tile:nth-child(3){animation-delay:.26s;}
.tile:hover{
  transform:translateY(-2px);
  border-color:rgba(59,130,246,.4);
}
.tile-label{
  font-size:11px;
  font-weight:600;
  letter-spacing:.05em;
  color:var(--muted);
}
.tile-value{
  font-family:var(--font-d);
  font-weight:700;
  font-size:22px;
  letter-spacing:-.01em;
}
.tile-sub{
  font-size:11.5px;
  color:var(--muted);
}
.card-head{
  padding:12px 18px;
  font-family:var(--font-d);
  font-weight:600;
  font-size:14px;
}
.divider{
  height:1px;
  background:rgba(255,255,255,.35);
  margin:0 18px;
}
html.light .divider{
  background:rgba(0,0,0,.4);
}
.card-body{
  padding:16px 18px;
}
.social-links{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.link{
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(255,255,255,.015);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.35);
  padding:9px 11px;
  border-radius:10px;
  color:var(--ink);
  font-size:12px;
  font-weight:600;
  transition:border-color .2s,transform .2s,background .2s;
}
.link:hover{
  border-color:var(--blue);
  transform:translateY(-1px);
}
html.light .link{
  background:rgba(0,0,0,.015);
  border:1px solid rgba(0,0,0,.4);
}
.link .ic{
  width:15px;
  height:15px;
  flex-shrink:0;
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
}
.link .ic svg{width:15px;height:15px;}
.link .label{flex:1;}
.link .arrow{
  color:var(--blue);
  display:flex;
  align-items:center;
  transition:transform .2s;
}
.link:hover .arrow{
  transform:translate(2px,-2px);
}

.site-footer{
  position:relative;
  z-index:2;
  width:100%;
  padding:14px 20px 20px;
  border-top:1px solid rgba(255,255,255,.35);
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px 18px;
  font-size:11px;
  color:rgba(255,255,255,.5);
}
html.light .site-footer{
  border-top:1px solid rgba(0,0,0,.4);
  color:rgba(0,0,0,.5);
}
.site-footer a:hover{
  color:var(--blue);
}

.view{
  display:none;
  flex:1;
  flex-direction:column;
}
.view.active{
  display:flex;
}
.calc-col{
  flex:0 1 460px;
  min-width:300px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.hist-col{
  flex:0 1 380px;
  min-width:260px;
}
.calc-card{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:16px;
  animation-delay:.08s;
}
.hist-card{
  animation-delay:.14s;
}
.calc-display{
  background:rgba(255,255,255,.015);
  border:1px solid rgba(255,255,255,.35);
  border-radius:10px;
  padding:18px 20px;
  text-align:right;
  min-height:130px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:4px;
  overflow:hidden;
}
html.light .calc-display{
  background:rgba(0,0,0,.015);
  border:1px solid rgba(0,0,0,.4);
}
.calc-expr{
  font-size:13.5px;
  color:var(--muted);
  min-height:16px;
  word-break:break-all;
}
.calc-result{
  font-family:var(--font-d);
  font-weight:700;
  font-size:44px;
  letter-spacing:-.01em;
  line-height:1.15;
  word-break:break-all;
}
.calc-keys{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.calc-keys button{
  height:64px;
  border-radius:10px;
  background:rgba(255,255,255,.015);
  border:1px solid rgba(255,255,255,.35);
  color:var(--ink);
  font-family:var(--font-d);
  font-weight:600;
  font-size:20px;
  cursor:pointer;
  outline:none;
  transition:border-color .2s,transform .1s,background .2s;
}
html.light .calc-keys button{
  background:rgba(0,0,0,.015);
  border:1px solid rgba(0,0,0,.4);
}
.calc-keys button:hover{
  border-color:var(--blue);
}
.calc-keys button:active,
.calc-keys button.pressed{
  transform:scale(.94);
  border-color:var(--blue);
}
.calc-keys .k-op{color:var(--blue);}
.calc-keys .k-fn{color:var(--muted);}
.calc-keys .k-eq{
  background:var(--blue);
  border-color:var(--blue);
  color:#fff;
}
.calc-keys .k-eq:hover{filter:brightness(1.1);}
.hist-head{
  font-size:15px;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.link-btn{
  background:none;
  border:none;
  color:var(--blue);
  font-family:var(--font-b);
  font-weight:600;
  font-size:11.5px;
  cursor:pointer;
  outline:none;
}
.hist-list{
  display:flex;
  flex-direction:column;
  max-height:430px;
  overflow:auto;
}
.hist-item{
  padding:13px 20px;
  text-align:right;
}
.hist-item + .hist-item{
  border-top:1px solid rgba(255,255,255,.15);
}
html.light .hist-item + .hist-item{
  border-top:1px solid rgba(0,0,0,.15);
}
.hist-expr{
  font-size:12.5px;
  color:var(--muted);
}
.hist-res{
  font-family:var(--font-d);
  font-weight:700;
  font-size:19px;
}
.hist-empty{
  padding:30px 20px;
  font-size:13px;
  color:var(--muted);
  text-align:center;
}

@media (max-width:980px){
  .sidebar{
    position:fixed;
    top:56px;
    bottom:0;
    left:0;
    background:var(--bg);
    z-index:5;
  }
  .content{padding:24px 20px 32px;}
  .aside{flex:1 1 100%;}
}
@media (max-width:640px){
  .site-header{padding:0 12px;}
  .content{padding:20px 14px 28px;}
  .greeting{font-size:17px;}
  .tiles{grid-template-columns:1fr;}
  .calc-col,.hist-col{flex:1 1 100%;}
  .term-col{flex:1 1 100%;}
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<header class="site-header">
  <div class="header-left">
    <button class="icon-btn" id="navBtn" type="button" title="Menü" aria-label="Menü">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>

(function(){
  var canvas = document.getElementById('matrix');
  var ctx = canvas.getContext('2d');
  var chars = "01{}<>/=+*#[]();$%&PLYTHONIC".split("");
  var fontSize = 15;
  var columns, drops, dpr;
  var fadeRGB = "2,3,4";

  function setup(){
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    columns = Math.floor(window.innerWidth / fontSize);
    drops = new Array(columns).fill(0).map(function(){
      return Math.floor(Math.random() * -50);
    });
  }
  setup();
  window.addEventListener('resize', setup);

  function draw(){
    ctx.fillStyle = "rgba(" + fadeRGB + ",0.12)";
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    ctx.font = fontSize + "px 'JetBrains Mono', monospace";

    for(var i = 0; i < drops.length; i++){
      var text = chars[Math.floor(Math.random() * chars.length)];
      var x = i * fontSize;
      var y = drops[i] * fontSize;

      ctx.fillStyle = "rgba(59,130,246,0.9)";
      ctx.fillText(text, x, y);

      if(y > window.innerHeight && Math.random() > 0.975){
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  setInterval(draw, 45);

  var themeBtn = document.getElementById('themeBtn');
  function applyTheme(theme){
    if(theme === 'light'){
      document.documentElement.classList.add('light');
      fadeRGB = "245,246,248";
      ctx.fillStyle = "rgba(245,246,248,1)";
      canvas.style.opacity = "0.9";
    } else {
      document.documentElement.classList.remove('light');
      fadeRGB = "2,3,4";
      ctx.fillStyle = "rgba(2,3,4,1)";
      canvas.style.opacity = "0.55";
    }
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    localStorage.setItem('plythonic-theme', theme);
  }
  themeBtn.addEventListener('click', function(){
    var next = document.documentElement.classList.contains('light') ? 'dark' : 'light';
    applyTheme(next);
  });
  var savedTheme = localStorage.getItem('plythonic-theme');
  applyTheme(savedTheme === 'light' ? 'light' : 'dark');
})();

  var locales = {tr:'tr-TR',en:'en-US',ru:'ru-RU'};
  var currentLang = 'tr';

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function updateClock(){
    var d = new Date();
    document.getElementById('clockValue').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function updateDate(){
    var d = new Date();
    var loc = locales[currentLang] || 'tr-TR';
    document.getElementById('dateValue').textContent = d.toLocaleDateString(loc, {day:'numeric', month:'long'});
    document.getElementById('dateSub').textContent = d.toLocaleDateString(loc, {weekday:'long'}) + ', ' + d.getFullYear();
    var tz = '';
    try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){}
    document.getElementById('clockSub').textContent = tz;
  }

  function initVisits(){
    var n = 1;
    try{
      n = (parseInt(localStorage.getItem('plythonic-visits'), 10) || 0) + 1;
      localStorage.setItem('plythonic-visits', n);
    }catch(e){}
    document.getElementById('visitValue').textContent = n;
  }

  var langSwitch = document.getElementById('langSwitch');
  var langCurrent = document.getElementById('langCurrent');
  var langCurrentLabel = document.getElementById('langCurrentLabel');
  var langMenu = document.getElementById('langMenu');

  var navBtn = document.getElementById('navBtn');

  function applyLang(lang){
    var dict = translations[lang] || translations.tr;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if(dict[key]) el.textContent = dict[key];
    });
    langCurrentLabel.textContent = dict.label;
    document.documentElement.lang = lang;
    langMenu.querySelectorAll('button').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });
    localStorage.setItem('plythonic-lang-v2', lang);
    currentLang = lang;
    updateDate();
    renderHistory();
  }

  langCurrent.addEventListener('click', function(e){
    e.stopPropagation();
    var isOpen = langSwitch.classList.toggle('open');
    langCurrent.setAttribute('aria-expanded', isOpen);
  });

  langMenu.querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click', function(){
      applyLang(btn.getAttribute('data-lang'));
      langSwitch.classList.remove('open');
      langCurrent.setAttribute('aria-expanded', 'false');
    });
  });

  document.addEventListener('click', function(){
    langSwitch.classList.remove('open');
    langCurrent.setAttribute('aria-expanded', 'false');
  });

  navBtn.addEventListener('click', function(e){
    e.stopPropagation();
    document.body.classList.toggle('nav-closed');
  });

  if(window.innerWidth <= 980){
    document.body.classList.add('nav-closed');
  }

  restartBtn.addEventListener('click', function(){
    restartBtn.classList.add('spin');
    setTimeout(function(){ location.reload(); }, 300);
  });

  var savedLang = localStorage.getItem('plythonic-lang-v2');
  applyLang(savedLang && translations[savedLang] ? savedLang : 'tr');
  updateClock();
  setInterval(updateClock, 1000);
  initVisits();

  var calc = {cur:'0', prev:null, op:null, awaiting:false, justEq:false, error:false, expr:''};
  var opSym = {'+':'+', '-':'−', '*':'×', '/':'÷'};
  var calcHistory;

  function loadHistory(){
    if(calcHistory) return calcHistory;
    calcHistory = [];
    try{
      calcHistory = JSON.parse(localStorage.getItem('plythonic-calc-history') || '[]');
    }catch(e){
      calcHistory = [];
    }
    if(!Array.isArray(calcHistory)) calcHistory = [];
    return calcHistory;
  }

  function saveHistory(){
    try{
      localStorage.setItem('plythonic-calc-history', JSON.stringify(calcHistory));
    }catch(e){}
  }

  function renderHistory(){
    var list = document.getElementById('histList');
    if(!list) return;
    var items = loadHistory();
    var dict = translations[currentLang] || translations.tr;
    list.innerHTML = '';
    if(!items.length){
      var empty = document.createElement('div');
      empty.className = 'hist-empty';
      empty.textContent = dict.calc_empty;
      list.appendChild(empty);
      return;
    }
    items.forEach(function(it){
      var row = document.createElement('div');
      row.className = 'hist-item';
      var e = document.createElement('div');
      e.className = 'hist-expr';
      e.textContent = it.expr;
      var r = document.createElement('div');
      r.className = 'hist-res';
      r.textContent = it.res;
      row.appendChild(e);
      row.appendChild(r);
      list.appendChild(row);
    });
  }

  function fmt(n){
    return String(parseFloat(n.toPrecision(12)));
  }

  function compute(a, op, b){
    if(op === '+') return a + b;
    if(op === '-') return a - b;
    if(op === '*') return a * b;
    if(op === '/') return b === 0 ? NaN : a / b;
    return b;
  }

  function renderCalc(){
    var dict = translations[currentLang] || translations.tr;
    var res = document.getElementById('calcResult');
    var ex = document.getElementById('calcExpr');
    var text = calc.error ? dict.calc_error : calc.cur;
    res.textContent = text;
    ex.textContent = calc.expr;
    var len = text.length;
    res.style.fontSize = len > 16 ? '24px' : len > 12 ? '32px' : len > 9 ? '38px' : '44px';
  }

  function resetCalc(){
    calc.cur = '0';
    calc.prev = null;
    calc.op = null;
    calc.awaiting = false;
    calc.justEq = false;
    calc.error = false;
    calc.expr = '';
  }

  function startFresh(){
    if(calc.justEq){
      calc.cur = '0';
      calc.expr = '';
      calc.justEq = false;
    }
    if(calc.awaiting){
      calc.cur = '0';
      calc.awaiting = false;
    }
  }

  function pressKey(k){
    if(calc.error && k !== 'AC') resetCalc();

    if(k === 'AC'){
      resetCalc();
    } else if(/^[0-9]$/.test(k)){
      startFresh();
      if(calc.cur.replace(/[-.]/g, '').length >= 15) return;
      calc.cur = calc.cur === '0' ? k : calc.cur + k;
    } else if(k === '.'){
      startFresh();
      if(calc.cur.indexOf('.') === -1) calc.cur += '.';
    } else if(k === '+' || k === '-' || k === '*' || k === '/'){
      var val = parseFloat(calc.cur);
      if(calc.op && !calc.awaiting){
        var r = compute(calc.prev, calc.op, val);
        if(!isFinite(r)){
          calc.error = true;
          calc.expr = '';
          renderCalc();
          return;
        }
        calc.prev = r;
        calc.cur = fmt(r);
      } else if(!calc.op){
        calc.prev = val;
      }
      calc.op = k;
      calc.awaiting = true;
      calc.justEq = false;
      calc.expr = fmt(calc.prev) + ' ' + opSym[k];
    } else if(k === '='){
      if(!calc.op) return;
      var a = calc.prev;
      var b = calc.awaiting ? calc.prev : parseFloat(calc.cur);
      var r2 = compute(a, calc.op, b);
      if(!isFinite(r2)){
        calc.error = true;
        calc.expr = '';
        renderCalc();
        return;
      }
      var line = fmt(a) + ' ' + opSym[calc.op] + ' ' + fmt(b);
      loadHistory().unshift({expr:line, res:fmt(r2)});
      if(calcHistory.length > 8) calcHistory.length = 8;
      saveHistory();
      renderHistory();
      calc.expr = line + ' =';
      calc.cur = fmt(r2);
      calc.prev = null;
      calc.op = null;
      calc.awaiting = false;
      calc.justEq = true;
    } else if(k === '%'){
      calc.cur = fmt(parseFloat(calc.cur) / 100);
      calc.awaiting = false;
    } else if(k === 'NEG'){
      if(parseFloat(calc.cur) !== 0){
        calc.cur = calc.cur.charAt(0) === '-' ? calc.cur.slice(1) : '-' + calc.cur;
      }
    } else if(k === 'DEL'){
      if(calc.justEq || calc.awaiting) return;
      calc.cur = calc.cur.slice(0, -1);
      if(calc.cur === '' || calc.cur === '-') calc.cur = '0';
    }
    renderCalc();
  }

  var keysEl = document.getElementById('calcKeys');
  keysEl.addEventListener('click', function(e){
    var btn = e.target.closest('button');
    if(btn) pressKey(btn.getAttribute('data-k'));
  });

  document.getElementById('histClear').addEventListener('click', function(){
    calcHistory = [];
    saveHistory();
    renderHistory();
  });

  document.addEventListener('keydown', function(e){
    if(!document.getElementById('viewCalc').classList.contains('active')) return;
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    var key = e.key;
    var k = null;
    if(/^[0-9]$/.test(key)) k = key;
    else if(key === '.' || key === ',') k = '.';
    else if(key === '+' || key === '-' || key === '*' || key === '/') k = key;
    else if(key === 'Enter' || key === '=') k = '=';
    else if(key === 'Backspace') k = 'DEL';
    else if(key === 'Escape') k = 'AC';
    else if(key === '%') k = '%';
    if(!k) return;
    e.preventDefault();
    pressKey(k);
    var btn = keysEl.querySelector('[data-k="' + k + '"]');
    if(btn){
      btn.classList.add('pressed');
      setTimeout(function(){ btn.classList.remove('pressed'); }, 110);
    }
  });

  var viewHome = document.getElementById('viewHome');
  var viewCalc = document.getElementById('viewCalc');
  var viewTerm = document.getElementById('viewTerm');
  var navHome = document.getElementById('navHome');
  var navCalc = document.getElementById('navCalc');
  var navTerm = document.getElementById('navTerm');

  function route(){
    var h = location.hash;
    var isCalc = h === '#calculator';
    var isTerm = h === '#terminal';
    viewHome.classList.toggle('active', !isCalc && !isTerm);
    viewCalc.classList.toggle('active', isCalc);
    viewTerm.classList.toggle('active', isTerm);
    navHome.classList.toggle('active', !isCalc && !isTerm);
    navCalc.classList.toggle('active', isCalc);
    navTerm.classList.toggle('active', isTerm);
  }
  window.addEventListener('hashchange', route);
  route();

  document.querySelectorAll('.sidebar .nav-item').forEach(function(a){
    a.addEventListener('click', function(){
      if(window.innerWidth <= 980) document.body.classList.add('nav-closed');
    });
  });

  renderCalc();
  renderHistory();

  /* ===== Terminal (Python + JavaScript, Web Worker) ===== */
  function workerMain(){
    var py = null;
    var base = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
    function send(t, x){ postMessage({type:t, text:x}); }
    function fmt(a){
      if(typeof a === 'string') return a;
      try{ return (typeof a === 'object' && a !== null) ? JSON.stringify(a, null, 2) : String(a); }
      catch(e){ return String(a); }
    }
    onmessage = async function(e){
      var m = e.data;
      try{
        if(m.lang === 'js'){
          ['log','info','warn','error'].forEach(function(k){
            console[k] = function(){
              send(k === 'error' ? 'err' : k === 'warn' ? 'warn' : 'out', Array.prototype.map.call(arguments, fmt).join(' '));
            };
          });
          var AF = Object.getPrototypeOf(async function(){}).constructor;
          var r = await new AF(m.code)();
          if(r !== undefined) send('res', fmt(r));
        } else {
          if(!py){
            send('loading', '');
            importScripts(base + 'pyodide.js');
            py = await loadPyodide({indexURL: base});
            py.setStdout({batched: function(t){ send('out', t); }});
            py.setStderr({batched: function(t){ send('err', t); }});
          }
          await py.loadPackagesFromImports(m.code);
          var r2 = await py.runPythonAsync(m.code);
          if(r2 !== undefined && r2 !== null) send('res', String(r2));
        }
        postMessage({type:'done'});
      }catch(err){
        var msg = (err && err.message) ? err.message : String(err);
        if(m.lang === 'js' && err && err.name) msg = err.name + ': ' + msg;
        send('error', msg);
      }
    };
  }

  var codeEl = document.getElementById('termCode');
  var outEl = document.getElementById('termOut');
  var langEl = document.getElementById('termLang');
  var runBtn = document.getElementById('termRun');
  var stopBtn = document.getElementById('termStop');
  var restartBtn2 = document.getElementById('termRestart');
  var killBtn = document.getElementById('termKill');
  var samples = {python:'', js:''};
  var worker = null, running = false;

  function tdict(){ return translations[currentLang] || translations.tr; }

  function add(text, cls){
    var d = document.createElement('div');
    d.className = 't-line' + (cls ? ' ' + cls : '');
    d.textContent = text;
    outEl.appendChild(d);
    outEl.scrollTop = outEl.scrollHeight;
  }

  function setRunning(v){
    running = v;
    runBtn.disabled = v;
    stopBtn.disabled = !v;
  }

  function handle(e){
    var m = e.data;
    if(m.type === 'out') add(m.text);
    else if(m.type === 'err') add(m.text, 't-err');
    else if(m.type === 'warn') add(m.text, 't-warn');
    else if(m.type === 'res') add('← ' + m.text, 't-out');
    else if(m.type === 'loading') add(tdict().term_loading, 't-out');
    else if(m.type === 'done'){ add(tdict().term_done, 't-ok'); setRunning(false); }
    else if(m.type === 'error'){ add(m.text, 't-err'); setRunning(false); }
  }

  function getWorker(){
    if(worker) return worker;
    var blob = new Blob(['(' + workerMain.toString() + ')()'], {type:'text/javascript'});
    worker = new Worker(URL.createObjectURL(blob));
    worker.onmessage = handle;
    worker.onerror = function(e){
      add(e.message || 'Worker error', 't-err');
      setRunning(false);
    };
    return worker;
  }

  function killWorker(){
    if(worker){ worker.terminate(); worker = null; }
  }

  function runCode(){
    if(running) return;
    var code = codeEl.value;
    if(!code.trim()) return;
    setRunning(true);
    getWorker().postMessage({lang: langEl.value, code: code});
  }

  function stopCode(){
    if(!running) return;
    killWorker();
    add('^C ' + tdict().term_stopped, 't-warn');
    setRunning(false);
  }

  function killCode(){
    killWorker();
    add(tdict().term_killed, 't-err');
    setRunning(false);
  }

  function restartCode(){
    killWorker();
    setRunning(false);
    outEl.innerHTML = '';
    runCode();
  }

  function saveTerm(){
    try{
      localStorage.setItem('plythonic-term-lang', langEl.value);
      localStorage.setItem('plythonic-term-code-' + langEl.value, codeEl.value);
    }catch(e){}
  }

  function codeFor(l){
    var c = null;
    try{ c = localStorage.getItem('plythonic-term-code-' + l); }catch(e){}
    return c !== null ? c : samples[l];
  }

  (function(){
    var l = 'python';
    try{ l = localStorage.getItem('plythonic-term-lang') || 'python'; }catch(e){}
    if(!samples.hasOwnProperty(l)) l = 'python';
    langEl.value = l;
    codeEl.value = codeFor(l);
  })();

  langEl.addEventListener('change', function(){
    codeEl.value = codeFor(langEl.value);
    try{ localStorage.setItem('plythonic-term-lang', langEl.value); }catch(e){}
  });
  codeEl.addEventListener('input', saveTerm);
  codeEl.addEventListener('keydown', function(e){
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault();
      runCode();
      return;
    }
    if(e.key === 'Tab'){
      e.preventDefault();
      var s = codeEl.selectionStart, en = codeEl.selectionEnd;
      codeEl.value = codeEl.value.slice(0, s) + '    ' + codeEl.value.slice(en);
      codeEl.selectionStart = codeEl.selectionEnd = s + 4;
      saveTerm();
    }
  });
  runBtn.addEventListener('click', runCode);
  stopBtn.addEventListener('click', stopCode);
  killBtn.addEventListener('click', killCode);
  restartBtn2.addEventListener('click', restartCode);
  document.getElementById('termClearCode').addEventListener('click', function(){
    codeEl.value = '';
    saveTerm();
    codeEl.focus();
  });
  document.getElementById('termClearOut').addEventListener('click', function(){
    outEl.innerHTML = '';
  });
})();
</script>

</body>
