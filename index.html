<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plythonic</title>
<meta name="description" content="Plythonic Discord Developeri">
<link rel="icon" type="image/png" href="logo.png" id="faviconLink">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020304;
  --panel:#12141B;
  --panel-solid:#0E1016;
  --line:#2A2E38;
  --ink:#F2F3F5;
  --muted:#8A8D95;
  --blue:#3B82F6;
  --green:#23C77A;
  --font-d:'Space Grotesk',sans-serif;
  --font-b:'Inter',sans-serif;
}
html.light{
  --bg:#F5F6F8;
  --panel:#FFFFFF;
  --panel-solid:#FFFFFF;
  --line:#E2E4E8;
  --ink:#0B0C0F;
  --muted:#6B6E76;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-b);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  position:relative;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  transition:background .25s,color .25s;
  touch-action:manipulation;
  -webkit-touch-callout:none;
}
button,a,.icon-btn,.lang-current,.lang-menu button{
  -webkit-tap-highlight-color:transparent;
  outline:none;
}
a{color:inherit;text-decoration:none;}
::selection{background:rgba(59,130,246,.35);color:#fff;}

#matrix{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  opacity:.55;
}

.site-header{
  position:relative;
  z-index:6;
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:56px;
  padding:0 16px;
  width:100%;
  border-bottom:1px solid rgba(255,255,255,.35);
  background:var(--bg);
}
html.light .site-header{
  border-bottom:1px solid rgba(0,0,0,.4);
}
.header-left{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--ink);
}
.brand .mark{
  position:relative;
  width:28px;
  height:28px;
  border-radius:8px 40% 40% 40%;
  background:var(--panel-solid);
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}
.brand .mark img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.brand .word{
  font-family:var(--font-d);
  font-weight:600;
  font-size:13.5px;
  letter-spacing:.02em;
}
.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
}
.icon-btn{
  width:30px;
  height:30px;
  border-radius:9px;
  background:var(--panel-solid);
  border:1px solid rgba(255,255,255,.35);
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:border-color .2s,color .2s,transform .2s;
}
html.light .icon-btn{
  border:1px solid rgba(0,0,0,.4);
}
.icon-btn:hover{
  border-color:var(--blue);
}
.icon-btn:active{
  transform:scale(.92);
}
.icon-btn svg{width:14px;height:14px;}
.icon-btn.spin svg{
  animation:spin-once .5s ease;
}
@keyframes spin-once{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
#themeBtn .icon-sun{display:none;}
#themeBtn .icon-moon{display:block;}
html.light #themeBtn .icon-sun{display:block;}
html.light #themeBtn .icon-moon{display:none;}
.lang-switch{
  position:relative;
}
.lang-current{
  height:30px;
  padding:0 10px;
  border-radius:9px;
  background:var(--panel-solid);
  border:1px solid rgba(255,255,255,.35);
  color:var(--blue);
  font-family:var(--font-b);
  font-weight:600;
  font-size:11.5px;
  letter-spacing:.03em;
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  transition:border-color .2s;
}
html.light .lang-current{
  border:1px solid rgba(0,0,0,.4);
}
.lang-current:hover{
  border-color:var(--blue);
}
.lang-current svg{
  width:11px;
  height:11px;
  color:var(--blue);
  transition:transform .2s;
}
.lang-switch.open .lang-current svg{
  transform:rotate(180deg);
}
.lang-menu{
  position:absolute;
  top:calc(100% + 8px);
  right:0;
  background:var(--panel-solid);
  border:1px solid rgba(255,255,255,.35);
  border-radius:10px;
  padding:6px;
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:100px;
  opacity:0;
  visibility:hidden;
  transform:translateY(-4px);
  transition:opacity .15s,transform .15s,visibility .15s;
  z-index:8;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.6);
}
html.light .lang-menu{
  border:1px solid rgba(0,0,0,.4);
}
.lang-switch.open .lang-menu{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}
.lang-menu button{
  background:transparent;
  border:none;
  color:var(--muted);
  font-family:var(--font-b);
  font-weight:500;
  font-size:11.5px;
  text-align:left;
  padding:7px 9px;
  border-radius:7px;
  cursor:pointer;
  transition:background .15s,color .15s;
}
.lang-menu button:hover{
  background:rgba(255,255,255,.05);
  color:var(--ink);
}
.lang-menu button.active{
  color:var(--blue);
  background:rgba(59,130,246,.1);
}

.layout{
  flex:1;
  display:flex;
  position:relative;
  z-index:1;
}
.sidebar{
  width:300px;
  flex-shrink:0;
  background:transparent;
  border-right:1px solid rgba(255,255,255,.35);
  padding:16px 14px;
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  gap:4px;
}
html.light .sidebar{
  border-right:1px solid rgba(0,0,0,.4);
}
body.nav-closed .sidebar{display:none;}
.nav-item{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 12px;
  border-radius:8px;
  font-size:13px;
  font-weight:500;
  color:var(--ink);
  transition:background .15s;
}
.nav-item:hover{
  background:rgba(255,255,255,.05);
}
html.light .nav-item:hover{
  background:rgba(0,0,0,.05);
}
.nav-item.active{
  background:rgba(59,130,246,.12);
  font-weight:600;
}
.nav-item.active::before{
  content:"";
  position:absolute;
  left:-14px;
  top:50%;
  transform:translateY(-50%);
  width:3px;
  height:22px;
  border-radius:0 3px 3px 0;
  background:var(--blue);
}
.nav-item svg{
  width:16px;
  height:16px;
  color:var(--blue);
  flex-shrink:0;
}
.nav-sep{
  height:1px;
  background:rgba(255,255,255,.35);
  margin:12px 0 10px;
}
html.light .nav-sep{
  background:rgba(0,0,0,.4);
}
.nav-label{
  padding:4px 12px 6px;
  font-size:11.5px;
  font-weight:600;
  color:var(--muted);
  letter-spacing:.04em;
}

main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:1;
}
.content{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:28px;
  padding:36px 40px 40px;
}

.card{
  background:rgba(18,20,27,.12);
  backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);
  border:1px solid rgba(255,255,255,.35);
  border-radius:14px;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06);
  transition:background .25s,border-color .25s,transform .2s;
  opacity:0;
  transform:translateY(18px);
  animation:card-in .6s cubic-bezier(.22,.61,.36,1) forwards;
}
html.light .card{
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(0,0,0,.4);
  box-shadow:0 12px 30px -18px rgba(0,0,0,.18);
}
@keyframes card-in{
  to{
    opacity:1;
    transform:translateY(0);
  }
}
.term-head{
  display:flex;
  align-items:center;
  gap:7px;
  padding:11px 16px;
  border-bottom:1px solid rgba(255,255,255,.35);
}
html.light .term-head{
  border-bottom:1px solid rgba(0,0,0,.4);
}
.site-footer{
  position:relative;
  z-index:2;
  width:100%;
  padding:14px 20px 20px;
  border-top:1px solid rgba(255,255,255,.35);
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px 18px;
  font-size:11px;
  color:rgba(255,255,255,.5);
}
html.light .site-footer{
  border-top:1px solid rgba(0,0,0,.4);
  color:rgba(0,0,0,.5);
}
.site-footer a:hover{
  color:var(--blue);
}

.view{
  display:none;
  flex:1;
  flex-direction:column;
}
.view.active{
  display:flex;
}

.home-wrap{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 56px;
  min-width:0;
}
.about-card{
  width:100%;
  max-width:none;
  min-width:0;
}
.about-grid{
  display:flex;
  flex-direction:column;
  gap:48px;
}
.about-top{
  display:flex;
  justify-content:flex-start;
  align-items:center;
  gap:40px;
  min-width:0;
}
.about-top .about-col{
  flex:0 1 520px;
}
.about-bottom{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:40px;
  min-width:0;
}
.about-bottom .about-col{
  flex:0 1 480px;
}
.about-col{
  min-width:0;
}
.about-col p{
  font-size:16px;
  line-height:1.85;
  color:var(--ink);
  overflow-wrap:anywhere;
  word-break:break-word;
  text-shadow:0 0 14px var(--bg),0 0 6px var(--bg);
}
.about-photo{
  flex:0 0 auto;
  min-width:0;
  display:flex;
  justify-content:flex-start;
  align-items:center;
}
.photo-frame{
  width:300px;
  max-width:100%;
  aspect-ratio:1/1;
  border-radius:20px;
  background:var(--panel-solid);
  border:1px solid rgba(59,130,246,.5);
  box-shadow:0 0 50px -6px rgba(59,130,246,.45);
  overflow:hidden;
  animation:photo-float 5s ease-in-out infinite;
}
.photo-frame img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
@keyframes photo-float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}
.code-card{
  flex:0 1 480px;
  width:480px;
  max-width:100%;
  min-width:0;
  height:250px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:rgba(10,12,17,.86);
  animation-delay:.2s;
}
html.light .code-card{
  background:rgba(255,255,255,.92);
}
.code-card .term-head{flex:0 0 auto;}
.code-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--blue);
}
.code-dot:nth-child(2){opacity:.6;}
.code-dot:nth-child(3){opacity:.3;}
.code-body{
  flex:1 1 auto;
  min-height:0;
  padding:14px 16px;
  overflow:hidden;
  white-space:pre;
  font-family:ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  font-size:12.5px;
  line-height:1.7;
  color:var(--ink);
}

.pl-wrap{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding:32px 56px;
  min-width:0;
}
.pl-block{
  width:100%;
  max-width:620px;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:22px;
}
.pl-head{
  display:flex;
  align-items:center;
  gap:16px;
}
.pl-icon{
  width:58px;
  height:58px;
  border-radius:16px;
  background:rgba(59,130,246,.1);
  border:1px solid rgba(59,130,246,.45);
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  box-shadow:0 0 36px -6px rgba(59,130,246,.45);
}
.pl-icon svg{width:30px;height:30px;}
.pl-title{
  font-family:var(--font-d);
  font-weight:700;
  font-size:34px;
  letter-spacing:-.01em;
}
.pl-block p{
  font-size:16px;
  line-height:1.85;
  color:var(--ink);
  overflow-wrap:anywhere;
  word-break:break-word;
  text-shadow:0 0 14px var(--bg),0 0 6px var(--bg);
}
.pl-link{
  align-self:flex-start;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 18px;
  border-radius:10px;
  background:var(--blue);
  color:#fff;
  font-weight:600;
  font-size:13px;
  transition:filter .2s,transform .1s;
}
.pl-link:hover{filter:brightness(1.1);}
.pl-link:active{transform:scale(.96);}
.social-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.social-link{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 18px;
  border-radius:12px;
  background:rgba(10,12,17,.86);
  border:1px solid rgba(255,255,255,.35);
  color:var(--ink);
  font-weight:600;
  font-size:14px;
  transition:border-color .2s,transform .2s;
}
html.light .social-link{
  background:rgba(255,255,255,.92);
  border:1px solid rgba(0,0,0,.4);
}
.social-link:hover{
  border-color:var(--blue);
  transform:translateY(-2px);
}
.social-ic{
  width:20px;
  height:20px;
  color:var(--blue);
  display:flex;
  flex-shrink:0;
}
.social-ic svg{width:20px;height:20px;}
.social-text{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.social-name{font-size:14px;}
.social-desc{
  font-size:12px;
  font-weight:500;
  color:var(--muted);
  overflow-wrap:anywhere;
}
.social-arrow{
  width:16px;
  height:16px;
  color:var(--blue);
  display:flex;
  transition:transform .2s;
}
.social-arrow svg{width:16px;height:16px;}
.social-link:hover .social-arrow{transform:translate(2px,-2px);}
.links-pair{
  flex:0 1 380px;
  min-width:0;
}
@media (max-width:980px){
  .sidebar{
    position:fixed;
    top:56px;
    bottom:0;
    left:0;
    background:var(--bg);
    z-index:5;
  }
  .content{padding:24px 20px 32px;}
  .home-wrap{padding:24px 20px;}
  .pl-wrap{padding:24px 20px;}
}
@media (max-width:760px){
  .about-grid{gap:24px;}
  .about-top{flex-direction:column;gap:24px;}
  .about-bottom{flex-direction:column;align-items:stretch;gap:24px;}
  .about-bottom .about-col,.about-top .about-col{flex:0 1 auto;}
  .code-card{width:100%;flex:0 0 auto;}
  .photo-frame{width:200px;}
  .links-pair{flex:0 0 auto;width:100%;}
  .about-photo{justify-content:center;}
}
@media (max-width:640px){
  .site-header{padding:0 12px;}
  .content{padding:20px 14px 28px;}
  .home-wrap{padding:16px 12px;}
  .pl-wrap{padding:16px 12px;}
  .pl-title{font-size:28px;}
}

</style>
</head>
<body>

<canvas id="matrix"></canvas>

<header class="site-header">
  <div class="header-left">
    <button class="icon-btn" id="navBtn" type="button" title="Menü" aria-label="Menü">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#">
      <span class="mark"><img src="plythonic.png" alt="" onerror="this.style.display='none'"></span>
      <span class="word">Plythonic</span>
    </a>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="themeBtn" type="button" title="Tema" aria-label="Tema">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
    </button>
    <button class="icon-btn" id="restartBtn" type="button" title="Yenilə" aria-label="Yenilə">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.36"/><path d="M21 4v5h-5"/></svg>
    </button>
    <div class="lang-switch" id="langSwitch">
      <button class="lang-current" id="langCurrent" type="button" aria-haspopup="true" aria-expanded="false">
        <span id="langCurrentLabel">TR</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="lang-menu" id="langMenu">
        <button type="button" data-lang="tr" class="active">Türkçe</button>
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="ru">Русский</button>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <a class="nav-item active" id="navHome" href="#home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
      <span data-i18n="nav_home">Ana Sayfa</span>
    </a>
    <a class="nav-item" id="navLinks" href="#links">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <span data-i18n="nav_links">Linkler</span>
    </a>
    <div class="nav-sep"></div>
    <div class="nav-label" data-i18n="nav_projects">PROJELER</div>
    <a class="nav-item" id="navPlython" href="#plython">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V4M9 3.4h6"/><circle cx="9" cy="13.2" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="13.2" r="1" fill="currentColor" stroke="none"/><path d="M9 16.5h6"/></svg>
      <span>Plython</span>
    </a>
  </aside>

  <main>
    <div class="view active" id="viewHome">
      <div class="home-wrap">
        <section class="about-card">
          <div class="about-grid">
            <div class="about-top">
              <div class="about-photo">
                <div class="photo-frame"><img src="plythonic.png" alt="Plythonic" onerror="this.style.display='none'"></div>
              </div>
              <div class="about-col">
                <p data-i18n="about_p1"></p>
              </div>
            </div>
            <div class="about-bottom">
              <div class="about-col">
                <p data-i18n="about_p2"></p>
              </div>
              <div class="card code-card">
                <div class="term-head">
                  <span class="code-dot"></span><span class="code-dot"></span><span class="code-dot"></span>
                </div>
                <div class="code-body" id="codeBody"></div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <div class="view" id="viewLinks">
      <div class="home-wrap">
        <section class="about-card">
          <div class="about-grid">

(function(){
  var canvas = document.getElementById('matrix');
  var ctx = canvas.getContext('2d');
  var chars = "01{}<>/=+*#[]();$%&PLYTHONIC".split("");
  var fontSize = 15;
  var columns, drops, dpr;
  var fadeRGB = "2,3,4";

  function setup(){
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    columns = Math.floor(window.innerWidth / fontSize);
    drops = new Array(columns).fill(0).map(function(){
      return Math.floor(Math.random() * -50);
    });
  }
  setup();
  window.addEventListener('resize', setup);

  function draw(){
    ctx.fillStyle = "rgba(" + fadeRGB + ",0.12)";
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    ctx.font = fontSize + "px 'JetBrains Mono', monospace";

    for(var i = 0; i < drops.length; i++){
      var text = chars[Math.floor(Math.random() * chars.length)];
      var x = i * fontSize;
      var y = drops[i] * fontSize;

      ctx.fillStyle = "rgba(59,130,246,0.9)";
      ctx.fillText(text, x, y);

      if(y > window.innerHeight && Math.random() > 0.975){
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  setInterval(draw, 45);

  var themeBtn = document.getElementById('themeBtn');
  function applyTheme(theme){
    if(theme === 'light'){
      document.documentElement.classList.add('light');
      fadeRGB = "245,246,248";
      ctx.fillStyle = "rgba(245,246,248,1)";
      canvas.style.opacity = "0.9";
    } else {
      document.documentElement.classList.remove('light');
      fadeRGB = "2,3,4";
      ctx.fillStyle = "rgba(2,3,4,1)";
      canvas.style.opacity = "0.55";
    }
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    localStorage.setItem('plythonic-theme', theme);
  }
  themeBtn.addEventListener('click', function(){
    var next = document.documentElement.classList.contains('light') ? 'dark' : 'light';
    applyTheme(next);
  });
  var savedTheme = localStorage.getItem('plythonic-theme');
  applyTheme(savedTheme === 'light' ? 'light' : 'dark');
})();

      links_p2:"Discord-сервер — лучшее место, чтобы получить поддержку по боту Plython и пообщаться с сообществом. На GitHub можно посмотреть код и проекты, которые я пишу. В моих аккаунтах Instagram и YouTube можно узнавать о новых работах и следить за новостями.",
      label:"RU"
    }
  };

  var locales = {tr:'tr-TR',en:'en-US',ru:'ru-RU'};
  var currentLang = 'tr';

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function updateClock(){
    if(!document.getElementById('clockValue')) return;
    var d = new Date();
    document.getElementById('clockValue').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function updateDate(){
    if(!document.getElementById('dateValue')) return;
    var d = new Date();
    var loc = locales[currentLang] || 'tr-TR';
    document.getElementById('dateValue').textContent = d.toLocaleDateString(loc, {day:'numeric', month:'long'});
    document.getElementById('dateSub').textContent = d.toLocaleDateString(loc, {weekday:'long'}) + ', ' + d.getFullYear();
    var tz = '';
    try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){}
    document.getElementById('clockSub').textContent = tz;
  }

  function initVisits(){
    if(!document.getElementById('visitValue')) return;
    var n = 1;
    try{
      n = (parseInt(localStorage.getItem('plythonic-visits'), 10) || 0) + 1;
      localStorage.setItem('plythonic-visits', n);
    }catch(e){}
    document.getElementById('visitValue').textContent = n;
  }

  var langSwitch = document.getElementById('langSwitch');
  var langCurrent = document.getElementById('langCurrent');
  var langCurrentLabel = document.getElementById('langCurrentLabel');
  var langMenu = document.getElementById('langMenu');
  var restartBtn = document.getElementById('restartBtn');
  var navBtn = document.getElementById('navBtn');

  function applyLang(lang){
    var dict = translations[lang] || translations.tr;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if(dict[key]) el.textContent = dict[key];
    });
    langCurrentLabel.textContent = dict.label;
    document.documentElement.lang = lang;
    langMenu.querySelectorAll('button').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });
    localStorage.setItem('plythonic-lang-v2', lang);
    currentLang = lang;
    updateDate();
  }

  langCurrent.addEventListener('click', function(e){
    e.stopPropagation();
    var isOpen = langSwitch.classList.toggle('open');
    langCurrent.setAttribute('aria-expanded', isOpen);
  });

  langMenu.querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click', function(){
      applyLang(btn.getAttribute('data-lang'));
      langSwitch.classList.remove('open');
      langCurrent.setAttribute('aria-expanded', 'false');
    });
  });

  document.addEventListener('click', function(){
    langSwitch.classList.remove('open');
    langCurrent.setAttribute('aria-expanded', 'false');
  });

  navBtn.addEventListener('click', function(e){
    e.stopPropagation();
    document.body.classList.toggle('nav-closed');
  });

  if(window.innerWidth <= 980){
    document.body.classList.add('nav-closed');
  }

  restartBtn.addEventListener('click', function(){
    restartBtn.classList.add('spin');
    setTimeout(function(){ location.reload(); }, 300);
  });

  var savedLang = localStorage.getItem('plythonic-lang-v2');
  applyLang(savedLang && translations[savedLang] ? savedLang : 'tr');
  updateClock();
  setInterval(updateClock, 1000);
  initVisits();

  var viewHome = document.getElementById('viewHome');
  var viewLinks = document.getElementById('viewLinks');
  var viewPlython = document.getElementById('viewPlython');

  var navPlython = document.getElementById('navPlython');

  function route(){
    var h = location.hash;
    var isLinks = h === '#links';
    var isPl = h === '#plython';
    var isHome = !isLinks && !isPl;
    viewHome.classList.toggle('active', isHome);
    viewLinks.classList.toggle('active', isLinks);
    viewPlython.classList.toggle('active', isPl);
    navHome.classList.toggle('active', isHome);
    navLinks.classList.toggle('active', isLinks);
    navPlython.classList.toggle('active', isPl);
  }
  window.addEventListener('hashchange', route);
  route();

    a.addEventListener('click', function(){
      if(window.innerWidth <= 980) document.body.classList.add('nav-closed');
