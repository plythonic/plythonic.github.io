<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plythonic</title>
<meta name="description" content="Plythonic — Discord bot developeri.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020304;
  --panel:#0C0D10;
  --line:#1B1C20;
  --ink:#F2F3F5;
  --muted:#888B92;
  --blue:#3B82F6;
  --font-d:'Space Grotesk',sans-serif;
  --font-b:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-b);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:24px;
  -webkit-font-smoothing:antialiased;
  position:relative;
  overflow:hidden;
}
#matrix{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  opacity:.55;
}
.card{
  width:100%;
  max-width:420px;
  text-align:center;
  position:relative;
  z-index:1;
}
.avatar{
  width:96px;
  height:96px;
  border-radius:50%;
  background:var(--panel);
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 22px;
  font-family:var(--font-d);
  font-weight:700;
  font-size:34px;
  color:var(--blue);
}
h1{
  font-family:var(--font-d);
  font-weight:700;
  font-size:26px;
  letter-spacing:-.01em;
}
p.tag{
  color:var(--muted);
  font-size:14px;
  margin-top:8px;
  line-height:1.6;
}
.links{
  margin-top:32px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.link{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--panel);
  border:1px solid var(--line);
  padding:13px 16px;
  border-radius:10px;
  color:var(--ink);
  text-decoration:none;
  font-weight:500;
  font-size:14px;
  transition:border-color .2s,transform .2s;
}
.link:hover{
  border-color:var(--blue);
  transform:translateY(-1px);
}
.link .ic{
  width:20px;
  height:20px;
  flex-shrink:0;
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
}
.link .ic svg{width:20px;height:20px;}
.link .label{flex:1;text-align:left;}
.link .check{
  width:17px;
  height:17px;
  flex-shrink:0;
  border-radius:50%;
  background:rgba(59,130,246,.15);
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
}
.link .check svg{width:11px;height:11px;}
footer{
  margin-top:40px;
  color:var(--line);
  font-size:11px;
  color:#4B4E55;
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="card">
  <div class="avatar">P</div>
  <h1>Plythonic</h1>
  <p class="tag">Discord bot developeri</p>

  <div class="links">
    <a class="link" href="https://discord.gg/acrKtExDAk">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4.5c-2 .6-3.6 1.6-5 3-1.6 3.6-2.3 7.6-2 11.5 1.8 1.5 3.8 2.5 6 3l1.2-2"/><path d="M16 4.5c2 .6 3.6 1.6 5 3 1.6 3.6 2.3 7.6 2 11.5-1.8 1.5-3.8 2.5-6 3l-1.2-2"/><path d="M8 15.5c2.8 1.3 5.2 1.3 8 0"/><circle cx="9" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg></span>
      <span class="label">Discord</span>
      <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    </a>
    <a class="link" href="https://www.instagram.com/">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></span>
      <span class="label">Instagram</span>
      <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    </a>
    <a class="link" href="https://github.com/">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 1.7 5.4 2 5.4 2a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 8.4c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V19"/></svg></span>
      <span class="label">GitHub</span>
      <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    </a>
    <a class="link" href="https://www.youtube.com/">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9.5l5 2.5-5 2.5v-5z" fill="currentColor" stroke="none"/></svg></span>
      <span class="label">YouTube</span>
      <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    </a>
  </div>

  <footer>© 2026 Plythonic</footer>
</div>

<script>
(function(){
  var canvas = document.getElementById('matrix');
  var ctx = canvas.getContext('2d');
  var chars = "01{}<>/=+*#[]();$%&PLYTHONIC".split("");
  var fontSize = 15;
  var columns, drops, dpr;

  function setup(){
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    columns = Math.floor(window.innerWidth / fontSize);
    drops = new Array(columns).fill(0).map(function(){
      return Math.floor(Math.random() * -50);
    });
  }
  setup();
  window.addEventListener('resize', setup);

  function draw(){
    ctx.fillStyle = "rgba(2,3,4,0.12)";
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    ctx.font = fontSize + "px 'JetBrains Mono', monospace";

    for(var i = 0; i < drops.length; i++){
      var text = chars[Math.floor(Math.random() * chars.length)];
      var x = i * fontSize;
      var y = drops[i] * fontSize;

      ctx.fillStyle = "rgba(59,130,246,0.9)";
      ctx.fillText(text, x, y);

      if(y > window.innerHeight && Math.random() > 0.975){
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  setInterval(draw, 45);
})();
</script>

</body>
</html>
