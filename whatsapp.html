<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lior - WhatsApp</title>
<meta name="description" content="Lior WhatsApp">
<link rel="icon" type="image/png" href="logo.png" id="faviconLink">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>try{if(localStorage.getItem('plythonic-theme')==='light')document.documentElement.classList.add('light');}catch(e){}
try{
  if('scrollRestoration' in history) history.scrollRestoration='manual';
  if(location.hash) history.replaceState(null,'',location.pathname+location.search);
  window.addEventListener('load',function(){ window.scrollTo(0,0); });
  window.addEventListener('pageshow',function(){ window.scrollTo(0,0); });
}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
    :root{--blue:#25D366;--blue-rgb:37,211,102;--on-blue:#fff;}
    .discord-search-input{flex:1;min-width:280px;max-width:500px;padding:14px 20px;border-radius:12px;background:var(--panel-solid);border:1px solid rgba(255,255,255,.35);color:var(--ink);font-family:var(--font-b);font-size:15px;transition:border-color .2s,box-shadow .2s;}
    html.light .discord-search-input{border:1px solid rgba(0,0,0,.4);}
    .tab-btn{padding:12px 24px;border-radius:10px;font-family:var(--font-b);font-weight:600;font-size:14px;cursor:pointer;transition:all .2s;visibility:hidden;}
    .tab-btn.ready{visibility:visible;}
    .tab-btn.active{background:var(--blue);color:var(--on-blue);border:1px solid var(--blue);}
    .tab-btn:not(.active){background:transparent;color:var(--soft);border:1px solid rgba(255,255,255,.35);}
    html.light .tab-btn:not(.active){border-color:rgba(0,0,0,.4);}
    .tab-btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(var(--blue-rgb),.3);}
    .card-number{position:absolute;top:20px;right:20px;background:rgba(var(--blue-rgb),.15);color:var(--blue);font-weight:700;font-size:18px;padding:6px 12px;border-radius:8px;font-family:var(--font-d);}
    .discord-card{background:linear-gradient(180deg,rgba(var(--blue-rgb),.09),rgba(10,12,17,.86) 55%) !important;}
    html.light .discord-card{background:linear-gradient(180deg,rgba(var(--blue-rgb),.09),rgba(255,255,255,.92) 55%) !important;}
    .discord-card:hover{border-color:var(--blue);box-shadow:0 22px 44px -26px rgba(var(--blue-rgb),.7);}
    .discord-card .ic{background:rgba(var(--blue-rgb),.12);border:1px solid rgba(var(--blue-rgb),.4);color:var(--blue);}
    .discord-card h2,.discord-card p{color:var(--soft);}
    html.light .discord-card h2{color:var(--ink);}
    html.light .discord-card p{color:var(--muted);}
  </style>
</head>
<body>

<canvas id="matrix"></canvas>

<header class="site-header">
  <div class="header-left">
    <a class="brand" href="./">
      <span class="mark"><img src="plythonic.png" alt="" onerror="this.style.display='none'"></span>
      <span class="word">Lior</span>
    </a>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="themeBtn" type="button" title="Tema" aria-label="Tema">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
    </button>
    <a class="icon-btn" href="./" title="Ana Səhifə" aria-label="Ana Səhifə">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
    <button class="icon-btn" id="restartBtn" type="button" title="Yenilə" aria-label="Yenilə">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.36"/><path d="M21 4v5h-5"/></svg>
    </button>
    <div class="lang-switch" id="langSwitch">
      <button class="lang-current" id="langCurrent" type="button" aria-haspopup="true" aria-expanded="false">
        <span id="langCurrentLabel">TR</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="lang-menu" id="langMenu">
        <button type="button" data-lang="tr" class="active">Türkçe</button>
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="ru">Русский</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="hero">
    <section class="intro">
      <div class="intro-head">
        <span class="eyebrow">Ücretsiz Üyelik</span>
        <h1>Lior WhatsApp Topluluğu</h1>
        <p class="lead">100+ WhatsApp grubundan ya da kanalından birine katıl ve topluluğun bir parçası ol.</p>
        <div style="margin-top:32px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
          <input type="text" id="searchInput" placeholder="Ara..." class="discord-search-input">
          <div style="display:flex;gap:8px;">
            <button id="tabServers" class="tab-btn active">...</button>
            <button id="tabBots" class="tab-btn">...</button>
          </div>
        </div>
      </div>
      <div class="info-grid" id="serverGrid"></div>
    </section>
  </div>
</main>

<footer class="site-footer">
  <span>© 2026 Lior</span>
</footer>

<script src="js/matrix.js"></script>
